name: Linux distribution packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the packages
        required: true
        default: v0.2.8
      source_ref:
        description: Source revision to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  rpm-fedora:
    name: RPM (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y cargo rust gcc rpm-build gtk3 webkit2gtk4.1 curl git tar gzip
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref }}
      - name: Build RPM
        run: sh packaging/rpm/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: distro-rpm-fedora
          path: dist/*.rpm
          if-no-files-found: error

  rpm-opensuse:
    name: RPM (openSUSE Tumbleweed)
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - name: Install build dependencies
        run: zypper --non-interactive install cargo rust gcc rpm-build libgtk-3-0 libwebkit2gtk-4_1-0 curl git tar gzip
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref }}
      - name: Build RPM
        run: sh packaging/rpm/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: distro-rpm-opensuse
          path: dist/*.rpm
          if-no-files-found: error

  arch-package:
    name: Package (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust gtk3 webkit2gtk-4.1 curl
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref }}
      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm --cleanbuild"
          mkdir -p dist
          cp packaging/arch/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: distro-package-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  attach-release-assets:
    name: Attach packages to GitHub release
    needs: [rpm-fedora, rpm-opensuse, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distro-*
          path: release-assets
          merge-multiple: true
      - name: Attach native packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
